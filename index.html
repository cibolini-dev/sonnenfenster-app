<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6267"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Projekt Sonnenfenster</title><link rel="stylesheet" href="styles.css"></head>
<body><header><div><h1>☀ Projekt Sonnenfenster</h1><p>Camping · Bergwandern · Wetterfenster</p></div><span class="version">V3.1</span></header>
<main>
<section class="weather"><div><h2>Wetter-Ranking</h2><p>Bestes 3-Tage-Sonnenfenster der nächsten 10 Tage. Regionen werden danach sortiert.</p></div>
<div class="weather-actions"><button id="weatherBtn">Wetter aktualisieren</button><span id="weatherStatus"></span></div></section>
<section><div id="regions" class="region-grid"></div></section>
<div class="controls"><input id="search" placeholder="Ort, Camping, Region, Tour suchen…"><select id="regionFilter"><option value="">Alle Regionen</option></select><select id="sunFilter"><option value="">Alle Wetterlagen</option><option value="75">☀ ab 75</option><option value="55">⛅ ab 55</option></select></div>
<section class="place-head"><h2>Plätze <span id="placeCount"></span></h2><button class="secondary" id="clearBtn">Filter löschen</button></section>
<section><div id="places" class="grid"></div></section>
</main>
<div id="detail" class="modal" hidden><div class="modal-card"><button class="close" id="closeDetail" aria-label="Schliessen">×</button><div id="detailBody"></div></div></div>
<footer>Wetterdaten: Open-Meteo · Sonnenfenster-Ranking ist eine Orientierung und keine alpine Sicherheitsprognose.</footer>
<script src="app.js"></script></body></html>
